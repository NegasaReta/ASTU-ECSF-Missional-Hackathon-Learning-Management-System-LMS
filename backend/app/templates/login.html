<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Go Preach</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#8B5CF6',
secondary: '#F59E0B'
},
borderRadius: {
'none': '0px',
'sm': '4px',
DEFAULT: '8px',
'md': '12px',
'lg': '16px',
'xl': '20px',
'2xl': '24px',
'3xl': '32px',
'full': '9999px',
'button': '8px'
},
fontFamily: {
'pacifico': ['Pacifico', 'serif'],
'inter': ['Inter', 'sans-serif']
}
}
}
}
</script>
<style>
:where([class^="ri-"])::before {
content: "\f3c2";
}
body {
font-family: 'Inter', sans-serif;
}
.step-card {
backdrop-filter: blur(10px);
background: rgba(255, 255, 255, 0.95);
border: 1px solid rgba(255, 255, 255, 0.2);
}
.input-field {
transition: all 0.3s ease;
}
.input-field:focus {
transform: translateY(-1px);
box-shadow: 0 8px 25px rgba(139, 92, 246, 0.15);
}
.floating-label {
transition: all 0.3s ease;
}
.input-focused .floating-label {
transform: translateY(-1.5rem) scale(0.85);
color: #8B5CF6;
}
.slide-enter {
animation: slideIn 0.5s ease-out;
}
@keyframes slideIn {
from { transform: translateX(20px); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}
.emoji-float {
animation: float 3s ease-in-out infinite;
}
@keyframes float {
0%, 100% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
}
.custom-checkbox {
appearance: none;
width: 1rem;
height: 1rem;
border: 2px solid #D1D5DB;
border-radius: 0.25rem;
background: white;
cursor: pointer;
position: relative;
transition: all 0.2s ease;
}
.custom-checkbox:checked {
background: #8B5CF6;
border-color: #8B5CF6;
}
.custom-checkbox:checked::after {
content: '✓';
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
color: white;
font-size: 0.75rem;
font-weight: bold;
}
.custom-checkbox:hover {
border-color: #8B5CF6;
}
</style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-white to-blue-50 min-h-screen">
<header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-purple-100">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between items-center h-16">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 bg-gradient-to-r from-primary to-purple-600 rounded-full flex items-center justify-center">
<i class="ri-community-line text-white text-sm"></i>
</div>
<span class="font-pacifico text-xl text-primary">Go Preach</span>
</div>
<a href="/register" data-readdy="true" class="flex items-center space-x-2 text-gray-600 hover:text-primary transition-colors">
<i class="ri-arrow-left-line"></i>
<span>Back to Register</span>
</a>
</div>
</div>
</header>
<main class="flex-1 py-8 px-4 sm:px-6 lg:px-8">
<div class="max-w-md mx-auto">
<div class="text-center mb-8">
<div class="inline-flex items-center space-x-2 mb-4">
<span class="text-4xl emoji-float">👋</span>
<h1 class="text-3xl font-bold text-gray-900">Welcome Back to Go Preach!</h1>
<span class="text-4xl emoji-float" style="animation-delay: 0.5s;">😊</span>
</div>
<p class="text-gray-600 text-lg">Sign in to your account</p>
<div class="mt-4">
<img src="https://readdy.ai/api/search-image?query=modern%20login%20security%20illustration%20with%20shield%20lock%20and%20user%20authentication%20symbols%2C%20clean%20minimalist%20design%20with%20purple%20and%20blue%20gradients%2C%20digital%20security%20concept%20with%20geometric%20shapes&width=400&height=200&seq=login1&orientation=landscape"
alt="Login Security" class="mx-auto rounded-lg object-cover w-full max-w-md h-32">
</div>
</div>
<div class="step-card rounded-2xl shadow-xl p-8 mb-6">
<form id="login-form" class="slide-enter">
<div class="space-y-6">
<div class="relative">
<input type="email" id="email" class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-primary peer" placeholder=" " required>
<label for="email" class="floating-label absolute left-4 top-3 text-gray-500 transition-all peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:-top-2 peer-focus:left-2 peer-focus:text-sm peer-focus:text-primary peer-focus:bg-white peer-focus:px-2">Email Address</label>
<div class="absolute right-3 top-3 w-6 h-6 flex items-center justify-center">
<i class="ri-mail-line text-gray-400"></i>
</div>
</div>
<div class="relative">
<input type="password" id="password" class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-primary peer" placeholder=" " required>
<label for="password" class="floating-label absolute left-4 top-3 text-gray-500 transition-all peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:-top-2 peer-focus:left-2 peer-focus:text-sm peer-focus:text-primary peer-focus:bg-white peer-focus:px-2">Password</label>
<div class="absolute right-3 top-3 w-6 h-6 flex items-center justify-center cursor-pointer" id="toggle-password">
<i class="ri-eye-off-line text-gray-400"></i>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<input type="checkbox" id="remember" class="custom-checkbox">
<label for="remember" class="text-sm text-gray-600 cursor-pointer">Remember me</label>
</div>
<a href="/password-reset" data-readdy="true" class="text-sm text-primary hover:underline">Forgot password?</a>
</div>
<button type="submit" class="w-full px-8 py-3 bg-gradient-to-r from-primary to-purple-600 text-white rounded-button hover:from-purple-600 hover:to-purple-700 transition-all transform hover:scale-105 !rounded-button whitespace-nowrap">
Sign In
<i class="ri-arrow-right-line ml-2"></i>
</button>
</div>
</form>
</div>
<div class="text-center text-sm text-gray-500">
Don't have an account? <a href="/register" data-readdy="true" class="text-primary hover:underline">Sign up here</a>
</div>
</div>
</main>
<script id="input-interactions">
document.addEventListener('DOMContentLoaded', function() {
const inputs = document.querySelectorAll('input');
inputs.forEach(input => {
const container = input.closest('.relative');
input.addEventListener('focus', function() {
container?.classList.add('input-focused');
});
input.addEventListener('blur', function() {
if (!input.value) {
container?.classList.remove('input-focused');
}
});
input.addEventListener('input', function() {
if (input.value) {
container?.classList.add('input-focused');
} else {
container?.classList.remove('input-focused');
}
});
});
});
</script>
<script id="password-toggle">
document.addEventListener('DOMContentLoaded', function() {
const passwordInput = document.getElementById('password');
const toggleButton = document.getElementById('toggle-password');
const toggleIcon = toggleButton.querySelector('i');
toggleButton.addEventListener('click', function() {
if (passwordInput.type === 'password') {
passwordInput.type = 'text';
toggleIcon.className = 'ri-eye-line text-gray-400';
} else {
passwordInput.type = 'password';
toggleIcon.className = 'ri-eye-off-line text-gray-400';
}
});
});
</script>
<script id="form-submission">
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('login-form');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert('Please fill in all fields');
            return;
        }

        submitButton.innerHTML = '<i class="ri-loader-4-line animate-spin mr-2"></i>Signing In...';
        submitButton.disabled = true;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include', // important to store session cookie
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            if (!response.ok) {
                alert(result.message || 'Login failed!');
                submitButton.disabled = false;
                submitButton.innerHTML = 'Sign In';
                return;
            }

            // Success animation
            submitButton.innerHTML = '<i class="ri-check-line mr-2"></i>Welcome Back!';
            submitButton.classList.remove('from-primary', 'to-purple-600');
            submitButton.classList.add('from-green-500', 'to-green-600');

            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1500);

        } catch (error) {
            alert('Network error — try again!');
            console.error(error);
            submitButton.disabled = false;
            submitButton.innerHTML = 'Sign In';
        }
    });
});
</script>

</body>
</html>
